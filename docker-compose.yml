# Optional containerized deployment for the Emplyo web application.
#
# IMPORTANT: This file does NOT define or own your SQL Server instance.
# Emplyo connects to the SQL Server already running on your machine (or a
# managed server) via ConnectionStrings__DefaultConnection.
#
# On Linux, the connection string below reaches a SQL Server published on the
# host's localhost:1433 through the special host-gateway address.
#
# The web container runs as the unprivileged "app" user. Uploaded documents and
# Data Protection keys are kept in named volumes so they survive image rebuilds.
#
# Usage:
#   EMPLYO_DB_PASSWORD='<your-sa-password>' docker compose up --build
# If the app is not accessed via localhost, set EMPLYO_ALLOWED_HOSTS to the real
# host name(s), e.g. EMPLYO_ALLOWED_HOSTS='emplyo.example.com'.
#
# Maintenance commands (see docs/DEPLOYMENT.md):
#   docker compose run --rm --entrypoint dotnet emplyo-web Emplyo.Web.dll migrate
services:
  emplyo-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: emplyo-web:latest
    container_name: emplyo-web
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Storage__DocumentsRoot: /var/lib/emplyo/documents
      # Adjust this to point at your existing SQL Server. Never commit real secrets.
      # For production use a least-privilege login and a trusted server certificate
      # (TrustServerCertificate=False). True is for local self-signed instances.
      ConnectionStrings__DefaultConnection: "Server=host.docker.internal,1433;Database=Emplyo;User Id=sa;Password=${EMPLYO_DB_PASSWORD:?set EMPLYO_DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;Encrypt=True"
      App__PublicBaseUrl: "${EMPLYO_PUBLIC_BASE_URL:-}"
      AllowedHosts: "${EMPLYO_ALLOWED_HOSTS:-localhost;127.0.0.1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Uploaded documents. Back these up together with the database.
      - emplyo_documents:/var/lib/emplyo/documents
      # ASP.NET Core Data Protection keys; keeps sessions valid across redeploys.
      - emplyo_dp_keys:/home/app/.aspnet/DataProtection-Keys
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # Optional: a brand-new SQL Server for isolated environments only.
  # Do NOT enable this if you already run a usable SQL Server instance.
  # sqlserver:
  #   image: mcr.microsoft.com/mssql/server:2022-latest
  #   environment:
  #     ACCEPT_EULA: "Y"
  #     MSSQL_SA_PASSWORD: "${EMPLYO_DB_PASSWORD:?set EMPLYO_DB_PASSWORD}"
  #     MSSQL_PID: "Developer"
  #   ports:
  #     - "14330:1433"
  #   volumes:
  #     - emplyo_sqlserver_data:/var/opt/mssql

volumes:
  emplyo_documents:
  emplyo_dp_keys:
  # emplyo_sqlserver_data:
